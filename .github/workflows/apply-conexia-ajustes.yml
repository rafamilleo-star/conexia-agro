          +});
          '''
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / 'adjustments.patch'
              path.write_text(patch, encoding='utf-8')
              check = subprocess.run(['git', 'apply', '--check', str(path)], capture_output=True, text=True)
              if check.returncode:
                  reverse = subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True, text=True)
                  if reverse.returncode == 0:
                      print('Os ajustes já estão aplicados.')
                  else:
                      raise SystemExit('O código mudou. Nenhum ajuste foi aplicado.\n' + check.stderr)
              else:
                  subprocess.run(['git', 'apply', str(path)], check=True)
                  print('Ensaio de conversas e estrutura da rede adicionados.')
