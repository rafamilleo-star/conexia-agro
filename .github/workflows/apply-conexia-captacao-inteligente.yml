          blob = base64.b64decode(''.join(package.split()), validate=True)
          if hashlib.sha256(blob).hexdigest() != "ca96f320bc6fc87a64f431a173232b940e1e29be86cec41d2f757e94824af97a":
              raise SystemExit('Código incompleto ao copiar; nada foi aplicado.')

          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / 'captacao.patch'
              path.write_bytes(gzip.decompress(blob))
              check = subprocess.run(
                  ['git', 'apply', '--check', str(path)],
                  capture_output=True, text=True
              )
              if check.returncode:
                  reverse = subprocess.run(
                      ['git', 'apply', '--reverse', '--check', str(path)],
                      capture_output=True, text=True
                  )
                  if reverse.returncode:
                      raise SystemExit(
                          'O código mudou; nenhuma atualização foi aplicada.\n' + check.stderr
                      )
                  print('Captação já aplicada.')
              else:
                  subprocess.run(['git', 'apply', str(path)], check=True)
                  print('Captação inteligente aplicada.')
          PY

