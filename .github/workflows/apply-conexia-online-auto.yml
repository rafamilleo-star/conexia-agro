name: Apply Conexia Online Auto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python scripts/patch_conexia_online_auto.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add api/_lib/relationshipAssistant/whatsappSender.js
          git add api/conexia-online-template-cron.js
          git add vercel.json

          git diff --cached --quiet && exit 0

          git commit -m "Automate conexia_online WhatsApp template"
          git push
