          expected = "a5173a88f3be031f9fb76fb54814800763067c529f1c6b56c70ad46e0fd59bdf"
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit("O conteúdo foi cortado ou alterado ao copiar. Nenhuma mudança aplicada.")

          patch = gzip.decompress(compressed).decode("utf-8")

          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / "danna.patch"
              path.write_text(patch, encoding="utf-8")
              check = subprocess.run(
                  ["git", "apply", "--check", str(path)],
                  capture_output=True, text=True
              )
              if check.returncode:
                  reverse = subprocess.run(
                      ["git", "apply", "--reverse", "--check", str(path)],
                      capture_output=True, text=True
                  )
                  if reverse.returncode == 0:
                      print("A atualização da Danna já está aplicada.")
                  else:
                      raise SystemExit(
                          "O código mudou; nenhum ajuste foi aplicado.\n" + check.stderr
                      )
              else:
                  subprocess.run(["git", "apply", str(path)], check=True)
                  print("Atualização completa da Danna aplicada.")
          PY

