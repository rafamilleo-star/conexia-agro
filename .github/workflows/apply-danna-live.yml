name: Apply Danna GPT-Live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch CONEXIA Live
        run: python scripts/patch_conexia_live.py

      - name: Validate
        run: |
          node --check src/lib/dannaLive.js
          node --check api/openai-live-session.js
          grep -q 'import DannaLive from "../lib/dannaLive"' src/components/ConexiaLabHome.jsx
          ! grep -q 'speechSynthesis' src/components/ConexiaLabHome.jsx
          ! grep -q 'SpeechRecognition' src/components/ConexiaLabHome.jsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ConexiaLabHome.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: migrate CONEXIA Live UI to GPT-Live"
          git push
