name: CONEXIA V2 - Home de Icones (sem merge)

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite ICONES para atualizar somente a branch V2
        required: true
        type: string

permissions:
  contents: write

jobs:
  nova-home:
    if: ${{ inputs.confirmacao == 'ICONES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Abrir somente a branch da V2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/conexia-v2-ciclo-relacional
          fetch-depth: 0

      - name: Verificar backup e versao base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=f32f887d4529f813c1c39d670853ef5910b58f06
          SAVED="$(git ls-remote --heads origin refs/heads/backup/conexia-original-2026-11-27 | cut -f1)"
          test "$SAVED" = "$BASE" || { echo '::error::Backup original diferente. Parando.'; exit 1; }
          test "$(git rev-parse HEAD)" = d365e5d0a06f1c303924dd141fbb4e996a0ee8e3 || { echo '::error::A V2 mudou desde a revisao. Parando.'; exit 1; }

      - name: Inserir tela inicial e conectar as paginas existentes
        shell: bash
        run: |
          set -euo pipefail
          cat > src/components/ConexiaV2Hub.jsx <<'CONEXIA_HUB'
          import React, { useMemo, useState } from 'react';
          import {
            Users, Brain, MessageCircle, CalendarDays, Target,
            ArrowRight, Sparkles, CheckCircle2, Clock3,
          } from 'lucide-react';
          import ConexiaEssential from './ConexiaEssential';
          import { computeRelationshipIntelligence } from '../../shared/relationshipIntelligence.js';

          const COLORS = {
            bg: '#080F23', panel: '#111C37', ink: '#F4F5FF',
            muted: '#ADBAD5', purple: '#8E67FF', border: '#2B3653',
          };

          const tiles = [
            { id: 'pessoas', title: 'Pessoas', subtitle: 'Seus contatos', icon: Users, color: '#8358F6' },
            { id: 'teia', title: 'Teia', subtitle: 'Mapa da rede', icon: Target, color: '#4775ED' },
            { id: 'danna', title: 'Danna', subtitle: 'Sua assistente', icon: Brain, color: '#A156E8' },
            { id: 'whatsapp', title: 'WhatsApp', subtitle: 'Danna no celular', icon: MessageCircle, color: '#179B68' },
            { id: 'diagnostico', title: 'Diagnóstico', subtitle: 'Perfil relacional', icon: Sparkles, color: '#E7A13D' },
            { id: 'insights', title: 'Insights', subtitle: 'Inteligência da rede', icon: Brain, color: '#5C7EF3' },
            { id: 'plano', title: 'Meu plano', subtitle: 'Próximas etapas', icon: CheckCircle2, color: '#B067EA' },
            { id: 'agenda', title: 'Agenda', subtitle: 'Acompanhar ações', icon: CalendarDays, color: '#E88E66' },
            { id: 'perfil', title: 'Meu perfil', subtitle: 'Dados e ajustes', icon: Users, color: '#6795A8' },
          ];

          const buttonBase = {
            border: 'none', cursor: 'pointer', fontFamily: "'DM Sans', sans-serif",
            WebkitTapHighlightColor: 'transparent',
          };

          export default function ConexiaV2Hub({
            firstName = '', userId, contacts = [], interactions = [], isPro = false,
            hasVoiceAccess = false, whatsappEnabled = false, onNavigate,
            onUpdated, onFirstPerson, onPerson,
          }) {
            const [subpage, setSubpage] = useState('inicio');
            const displayName = String(firstName).trim().split(/\s+/)[0] || 'você';
            const pendingCount = contacts.filter((c) => Boolean(c?.next_action ?? c?.nextAction)).length;

            const recommendation = useMemo(() => {
              try { return computeRelationshipIntelligence({ contacts, interactions })?.main ?? null; }
              catch { return null; }
            }, [contacts, interactions]);

            const recommended = contacts.find((c) =>
              c.id === (recommendation?.relationshipId ?? recommendation?.contactId)
            );

            const enter = (id) => {
              if (id === 'preparar' || id === 'registrar' || id === 'ciclo') {
                setSubpage(id);
                return;
              }
              onNavigate?.(id);
            };

            if (subpage !== 'inicio') {
              return (
                <div style={{ maxWidth: 850, margin: '0 auto' }}>
                  <ConexiaEssential
                    key={subpage}
                    userId={userId}
                    contacts={contacts}
                    interactions={interactions}
                    isPro={isPro}
                    onUpdated={onUpdated}
                    onFirstPerson={onFirstPerson}
                    onPerson={onPerson}
                    onBack={() => setSubpage('inicio')}
                    initialMode={
                      subpage === 'preparar'
                        ? 'prepare'
                        : subpage === 'registrar' ? 'register' : 'home'
                    }
                  />
                </div>
              );
            }

            return (
              <div style={{
                maxWidth: 1080,
                margin: '0 auto',
                padding: 'clamp(18px, 4vw, 32px)',
                borderRadius: 26,
                background: COLORS.bg,
                backgroundImage: 'radial-gradient(circle at 90% 0%, rgba(141,100,255,.24), transparent 35%), radial-gradient(circle at 5% 65%, rgba(45,83,191,.15), transparent 34%)',
                border: 1px solid ${COLORS.border},
                color: COLORS.ink,
                fontFamily: "'DM Sans', sans-serif",
              }}>
                <div style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  gap: 12,
                  marginBottom: 24,
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
                    <div aria-hidden="true" style={{
                      width: 42, height: 42,
                      display: 'grid', placeItems: 'center',
                      borderRadius: 13,
                      background: 'linear-gradient(135deg,#A46DFF,#4257D8)',
                      fontSize: 25, fontWeight: 800,
                    }}>∞</div>
                    <div>
                      <strong style={{ fontSize: 18, letterSpacing: '.06em' }}>CONÉXIA</strong>
                      <div style={{ fontSize: 10, color: COLORS.muted }}>INTELIGÊNCIA RELACIONAL</div>
                    </div>
                  </div>
                  <span style={{
                    borderRadius: 30,
                    border: 1px solid ${COLORS.border},
                    color: '#CDC4FF',
                    padding: '7px 11px',
                    fontSize: 11,
                  }}>PRÉVIA V2</span>
                </div>

                <div style={{ marginBottom: 24 }}>
                  <div style={{ color: '#CDC4FF', fontSize: 13, marginBottom: 8 }}>
                    Olá, {displayName} 👋
                  </div>
                  <h1 style={{
                    fontSize: 'clamp(26px, 5vw, 38px)',
                    lineHeight: 1.12,
                    margin: '0 0 12px',
                    fontWeight: 800,
                  }}>
                    Sua rede de relacionamentos.
                    <span style={{ display: 'block', color: '#AD93FF' }}>Tudo ao seu alcance.</span>
                  </h1>
                  <p style={{ color: COLORS.muted, margin: 0, fontSize: 14, lineHeight: 1.5 }}>
                    Escolha o que quer fazer. O CONÉXIA leva você diretamente para a ferramenta certa.
                  </p>
                </div>

                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
                  gap: 12,
                }}>
                  <button type="button" onClick={() => enter('preparar')}
                    style={{
                      ...buttonBase,
                      textAlign: 'left',
                      padding: 20,
                      borderRadius: 18,
                      color: '#FFFFFF',
                      background: 'linear-gradient(135deg,#8654F7,#5047D8)',
                      boxShadow: '0 12px 36px rgba(79,57,180,.25)',
                    }}>
                    <Sparkles size={27} aria-hidden="true" />
                    <div style={{ fontSize: 17, fontWeight: 800, margin: '16px 0 5px' }}>
                      Preparar uma conversa
                    </div>
                    <div style={{ fontSize: 12, opacity: .93, lineHeight: 1.45 }}>
                      Veja o histórico e o que vale lembrar antes de conversar.
                    </div>
                    <ArrowRight size={19} style={{ marginTop: 12 }} aria-hidden="true" />
                  </button>

                  <button type="button" onClick={() => enter('registrar')}
                    style={{
                      ...buttonBase,
                      textAlign: 'left',
                      padding: 20,
                      borderRadius: 18,
                      color: COLORS.ink,
                      background: COLORS.panel,
                      border: '1px solid #455078',
                    }}>
                    <MessageCircle size={27} color="#AD93FF" aria-hidden="true" />
                    <div style={{ fontSize: 17, fontWeight: 800, margin: '16px 0 5px' }}>
                      Registrar conversa
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.muted, lineHeight: 1.45 }}>
                      Guarde o combinado e não perca o próximo passo.
                    </div>
                    <ArrowRight size={19} color="#AD93FF" style={{ marginTop: 12 }} aria-hidden="true" />
                  </button>
                </div>

                {(recommended || pendingCount > 0) && (
                  <div style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 12,
                    flexWrap: 'wrap',
                    marginTop: 14,
                    padding: '11px 16px',
                    background: 'rgba(255,255,255,.06)',
                    borderRadius: 12,
                    border: 1px solid ${COLORS.border},
                  }}>
                    <Clock3 size={17} color="#B9A3FF" aria-hidden="true" />
                    <span style={{ fontSize: 12, color: COLORS.muted, flex: 1 }}>
                      {recommended
                        ? Para olhar agora: ${recommended.name}
                        : ${pendingCount} compromisso(s) em aberto}
                    </span>
                    <button type="button" onClick={() => enter('ciclo')}
                      style={{
                        ...buttonBase,
                        background: 'transparent',
                        color: '#D7CAFF',
                        fontWeight: 700,
                        fontSize: 12,
                      }}>
                      Ver ação →
                    </button>
                  </div>
                )}

                <section style={{ marginTop: 30 }} aria-label="Ferramentas do CONÉXIA">
                  <div style={{
                    display: 'flex',
                    justifyContent: 'space-between',
                    alignItems: 'baseline',
                    gap: 12,
                    marginBottom: 14,
                  }}>
                    <h2 style={{ fontSize: 17, margin: 0 }}>Suas ferramentas</h2>
                    <span style={{ color: COLORS.muted, fontSize: 12 }}>Toque para entrar</span>
                  </div>

                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(132px, 1fr))',
                    gap: 11,
                  }}>
                    {tiles.map((tile) => {
                      const Icon = tile.icon;
                      const subtitle =
                        tile.id === 'whatsapp' && !whatsappEnabled
                          ? 'Configurar acesso'
                          : tile.subtitle;

                      return (
                        <button key={tile.id} type="button" onClick={() => enter(tile.id)}
                          style={{
                            ...buttonBase,
                            textAlign: 'left',
                            background: '#FFFFFF',
                            color: '#14203A',
                            minHeight: 142,
                            padding: 16,
                            borderRadius: 18,
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'flex-start',
                            boxShadow: '0 8px 22px rgba(1,4,18,.12)',
                          }}>
                          <div style={{
                            width: 46, height: 46,
                            display: 'grid',
                            placeItems: 'center',
                            borderRadius: 14,
                            background: ${tile.color}1F,
                            color: tile.color,
                            marginBottom: 'auto',
                          }}>
                            <Icon size={24} strokeWidth={2.2} aria-hidden="true" />
                          </div>
                          <strong style={{ fontSize: 14, marginTop: 13 }}>
                            {tile.title}
                          </strong>
                          <span style={{
                            fontSize: 11,
                            color: '#60708B',
                            marginTop: 3,
                            lineHeight: 1.25,
                          }}>
                            {subtitle}
                          </span>
                        </button>
                      );
                    })}

                    {hasVoiceAccess && (
                      <button type="button" onClick={() => enter('danna-voz')}
                        style={{
                          ...buttonBase,
                          textAlign: 'left',
                          background: '#FFFFFF',
                          color: '#14203A',
                          minHeight: 142,
                          padding: 16,
                          borderRadius: 18,
                          display: 'flex',
                          flexDirection: 'column',
                          alignItems: 'flex-start',
                        }}>
                        <div style={{
                          width: 46, height: 46,
                          display: 'grid',
                          placeItems: 'center',
                          borderRadius: 14,
                          background: '#AD93FF33',
                          color: '#8156E9',
                          marginBottom: 'auto',
                        }}>
                          <MessageCircle size={24} strokeWidth={2.2} aria-hidden="true" />
                        </div>
                        <strong style={{ fontSize: 14, marginTop: 13 }}>Danna por voz</strong>
                        <span style={{ fontSize: 11, color: '#60708B', marginTop: 3 }}>
                          Conversa ao vivo
                        </span>
                      </button>
                    )}
                  </div>
                </section>

                <div style={{
                  color: '#8393AF',
                  fontSize: 11,
                  lineHeight: 1.5,
                  marginTop: 23,
                  textAlign: 'center',
                }}>
                  Prévia de navegação: as páginas antigas podem acessar o banco real.
                  Não salve alterações durante este teste.
                </div>
              </div>
            );
          }
          CONEXIA_HUB

          cat > /tmp/conexia_home_patch.py <<'CONEXIA_PATCH'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          cycle_path = Path('src/components/ConexiaEssential.jsx')
          hub_path = Path('src/components/ConexiaV2Hub.jsx')

          assert app_path.exists() and cycle_path.exists(), 'A branch não contém os arquivos da V2'
          assert hub_path.exists(), 'Novo componente não foi criado'

          def one(s, old, new, title):
              count = s.count(old)
              if count != 1:
                  raise SystemExit('PARADO - ' + title + ' (esperado 1 ocorrência; encontrado ' + str(count) + ')')
              return s.replace(old, new, 1)

          app = app_path.read_text()
          cycle = cycle_path.read_text()

          app = one(
              app,
              "import ConexiaEssential from './components/ConexiaEssential';",
              "import ConexiaEssential from './components/ConexiaEssential';\nimport ConexiaV2Hub from './components/ConexiaV2Hub';",
              'importar hub'
          )

          app = one(
              app,
              "  const conexiaV2Preview = new URLSearchParams(window.location.search).get('conexia_v2') === '1';",
              "  const conexiaV2Preview = new URLSearchParams(window.location.search).get('conexia_v2') === '1';\n  const [previewVoice, setPreviewVoice] = useState(false);",
              'estado de voz'
          )

          old = """    if (conexiaV2Preview) return <ConexiaEssential
                userId={user?.id} contacts={cts} interactions={its} isPro={isPro}
                onUpdated={load}
                onFirstPerson={() => setView('startNetwork')}
                onPerson={(id) => { setSelId(id); setRedeSubTab('pessoas'); setView('contacts'); }}
              />;"""

          new = """    if (conexiaV2Preview && !(previewVoice && isConexiaLab)) return (
                <ConexiaV2Hub
                  firstName={profile?.first_name || profile?.name || ''}
                  userId={user?.id}
                  contacts={cts}
                  interactions={its}
                  isPro={isPro}
                  hasVoiceAccess={hasVoiceAccess}
                  whatsappEnabled={hasWhatsappAccess && Boolean(profile?.whatsapp)}
                  onUpdated={load}
                  onFirstPerson={() => setView('startNetwork')}
                  onPerson={(id) => { setSelId(id); setRedeSubTab('pessoas'); setView('contacts'); }}
                  onNavigate={(target) => {
                    setPreviewVoice(false);
                    setSelId(null);
                    if (target === 'pessoas' || target === 'teia') {
                      setRedeSubTab(target === 'pessoas' ? 'pessoas' : 'teia');
                      setView('contacts');
                      return;
                    }
                    if (target === 'danna-voz') {
                      if (hasVoiceAccess) { setPreviewVoice(true); setDannaHome(true); return; }
                      setInsightsSubTab('ia'); setView('insights'); return;
                    }
                    if (target === 'danna' || target === 'insights') {
                      setInsightsSubTab('ia');
                      setDannaIaSection('insights');
                      setView('insights');
                      return;
                    }
                    if (target === 'whatsapp') {
                      if (hasWhatsappAccess && profile?.whatsapp) {
                        window.open('https://wa.me/5511988630785', '_blank', 'noopener,noreferrer');
                      } else setView('perfil');
                      return;
                    }
                    if (target === 'diagnostico') { setInsightsSubTab('report'); setView('insights'); return; }
                    if (target === 'plano') { setInsightsSubTab('plano'); setView('insights'); return; }
                    if (target === 'agenda') { setView('agenda'); return; }
                    if (target === 'perfil') { setView('perfil'); return; }
                  }}
                />
              );"""

          app = one(app, old, new, 'substituir home da V2')

          app = one(
              app,
              'onClick={() => setDannaHome(false)}',
              'onClick={() => { setDannaHome(false); setPreviewVoice(false); }}',
              'voltar da Danna'
          )

          app = one(
              app,
              '        {view === "dash" && renderDash()}',
              '''        {conexiaV2Preview && view !== "dash" && (
                    <button type="button"
                      onClick={() => { setView('dash'); setSelId(null); setPreviewVoice(false); }}
                      style={{ background: '#201842', border: '1px solid #8E67FF', color: '#E8DDFF', borderRadius: 10, minHeight: 44, padding: '10px 16px', cursor: 'pointer', fontWeight: 700, marginBottom: 16 }}>
                      ← Início V2
                    </button>
                  )}
                  {view === "dash" && renderDash()}''',
              'atalho de retorno ao início'
          )

          app = one(
              app,
              '      {!isMobile && (\n        <nav style={{ width: 190',
              '      {!isMobile && !(conexiaV2Preview && view === "dash") && (\n        <nav style={{ width: 190',
              'ocultar menu lateral no hub'
          )

          app = one(
              app,
              '      {isMobile && (\n        <div style={{ background: C.sf, borderBottom:',
              '      {isMobile && !(conexiaV2Preview && view === "dash") && (\n        <div style={{ background: C.sf, borderBottom:',
              'ocultar cabeçalho duplicado no hub'
          )

          app = one(
              app,
              '      {isMobile && (\n        <nav\n          style={{\n            position: "fixed",',
              '      {isMobile && !(conexiaV2Preview && view === "dash") && (\n        <nav\n          style={{\n            position: "fixed",',
              'ocultar barra inferior duplicada no hub'
          )

          app = one(
              app,
              'paddingBottom: isMobile\n            ? "calc(104px + env(safe-area-inset-bottom))"',
              'paddingBottom: isMobile\n            ? (conexiaV2Preview && view === "dash" ? "calc(24px + env(safe-area-inset-bottom))" : "calc(104px + env(safe-area-inset-bottom))")',
              'padding do hub mobile'
          )

          cycle = one(
              cycle,
              'export default function ConexiaEssential({userId,contacts=[],interactions=[],isPro,onUpdated,onFirstPerson,onPerson}) {',
              "export default function ConexiaEssential({userId,contacts=[],interactions=[],isPro,onUpdated,onFirstPerson,onPerson,onBack,initialMode='home'}) {",
              'parâmetros do ciclo'
          )

          cycle = one(
              cycle,
              "  const [mode,setMode]=useState('home');",
              '  const [mode,setMode]=useState(initialMode);',
              'abrir preparar ou registrar'
          )

          cycle = one(
              cycle,
              'onClick={()=>window.location.assign(window.location.pathname)}',
              'onClick={()=>onBack ? onBack() : window.location.assign(window.location.pathname)}',
              'voltar do ciclo'
          )

          app_path.write_text(app)
          cycle_path.write_text(cycle)
          print('OK - Home V2 com icones conectados e retorno para inicio.')
          CONEXIA_PATCH

          python3 /tmp/conexia_home_patch.py
          git diff --check

      - name: Compilar e verificar
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Enviar alteracoes somente para a V2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/components/ConexiaEssential.jsx src/components/ConexiaV2Hub.jsx
          git commit -m 'feat: home V2 de icones com navegacao real'
          git push origin HEAD:refs/heads/feat/conexia-v2-ciclo-relacional
          echo 'Nova Home V2 publicada apenas na branch de previa.'
