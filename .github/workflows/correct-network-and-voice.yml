name: CONEXIA - círculos e voz

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conexia-circles-voice-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Abrir main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar código dos círculos e da voz
        run: python scripts/correct-network-and-voice.py

      - name: Instalar dependências
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verificar círculos
        run: node --test tests/networkCircles.test.js

      - name: Compilar aplicativo
        run: npm run build

      - name: Salvar correções na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            shared/networkCircles.js \
            src/App.jsx \
            src/components/ConexiaCircleNetwork.jsx \
            src/components/ConexiaLabHome.jsx \
            src/components/ContactCircleAssignment.jsx \
            src/components/ContactCircleField.jsx \
            src/lib/dannaFishLive.js \
            src/lib/useNetworkCircles.js \
            tests/networkCircles.test.js

          if git diff --cached --quiet; then
            echo "Correções já aplicadas."
            exit 0
          fi

          git commit -m "Add expandable network circles and guard Fish voice against echo"
          git push origin HEAD:main
