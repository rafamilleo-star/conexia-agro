name: Danna - iniciar com um clique

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Aplicar ajuste
        run: python scripts/patch_danna_single_click.py

      - name: Sincronizar lock de dependencias
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Validar compilacao
        run: npm run build

      - name: Salvar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/ConexiaLabHome.jsx package-lock.json
          if git diff --cached --quiet; then
            echo "Ajuste ja aplicado."
          else
            git commit -m "Fix dependency lock and start Danna from beta click"
            git push origin HEAD:main
          fi
