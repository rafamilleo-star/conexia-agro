<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONÉXIA — Inteligência Relacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #06060B; }
      ::selection { background: rgba(203,165,78,0.25); }
      input::placeholder, textarea::placeholder { color: #5E5B6E; }
      select option { background: #0E0E18; color: #EDE9E0; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1A1A2C; border-radius: 4px; }

      /* Feedback tátil visual: todo botão "afunda" levemente ao ser tocado/
         clicado, como no iOS. Uma linha, aplicada a todo botão do app de
         uma vez — nenhum componente precisa declarar isso individualmente. */
      button:not(:disabled):active { transform: scale(0.97); }
      button { transition: transform 90ms cubic-bezier(0.4, 0, 0.2, 1); }

      /* Respeita quem tem "reduzir movimento" ligado no sistema — inclusive
         para as animações adicionadas nesta rodada (toast, skeleton, etc). */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
